name: Generate blog post from transcript

# Push one or more .txt transcripts to _transcripts/ on main, or run manually
# from the Actions tab with a slug (re-generates that post from its transcript).

on:
  push:
    branches: [main]
    paths:
      - '_transcripts/**.txt'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Transcript slug to (re)generate, e.g. wandsworth-lfa-2026'
        required: true

concurrency:
  group: generate-post
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out which transcripts to process
        id: find
        env:
          BEFORE: ${{ github.event.before }}
          INPUT_SLUG: ${{ github.event.inputs.slug }}
        run: |
          if [ -n "$INPUT_SLUG" ]; then
            SLUGS="$INPUT_SLUG"
          else
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="HEAD~1..HEAD"
            else
              RANGE="$BEFORE..HEAD"
            fi
            SLUGS=$(git diff --name-only --diff-filter=AM $RANGE -- '_transcripts/*.txt' \
                    | xargs -r -n1 basename | sed 's/\.txt$//' | tr '\n' ' ')
          fi
          SLUGS=$(echo $SLUGS)
          if [ -z "$SLUGS" ]; then
            echo "No new or changed transcripts in this push."
          else
            for s in $SLUGS; do
              [ -f "_transcripts/$s.txt" ] || { echo "Missing _transcripts/$s.txt"; exit 1; }
            done
            echo "Transcripts to process: $SLUGS"
          fi
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.find.outputs.slugs != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.find.outputs.slugs != ''
        run: pip install --upgrade anthropic

      - name: Generate posts and sidecars
        if: steps.find.outputs.slugs != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLUGS: ${{ steps.find.outputs.slugs }}
        run: |
          for s in $SLUGS; do
            TRANSCRIPT_PATH="_transcripts/$s.txt" SLUG="$s" python .github/scripts/generate_post.py
          done

      - name: Add cards to the index
        if: steps.find.outputs.slugs != ''
        env:
          SLUGS: ${{ steps.find.outputs.slugs }}
        run: python .github/scripts/update_index.py $SLUGS

      - name: Commit and push
        if: steps.find.outputs.slugs != ''
        env:
          SLUGS: ${{ steps.find.outputs.slugs }}
        run: |
          git config user.name "on-foot-bot"
          git config user.email "on-foot-bot@users.noreply.github.com"
          git add _posts/ _data/ index.html
          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Generate post: $SLUGS"
          git pull --rebase origin main
          git push origin HEAD:main
