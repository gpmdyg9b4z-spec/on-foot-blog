name: Build site

# Runs on every push to main that touches posts, transcripts or the build files.
# - New or changed transcripts in _transcripts/ are turned into posts by Claude.
# - Then the homepage, filters and "More walks" links are rebuilt from the posts,
#   so hand-uploaded posts are picked up too.
# Run it manually from the Actions tab to rebuild, optionally regenerating one post.

on:
  push:
    branches: [main]
    paths:
      - '_transcripts/**.txt'
      - '_posts/**'
      - 'assets/**'
      - '.github/templates/**'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Optional: transcript slug to regenerate, e.g. wandsworth-lfa-2026'
        required: false

concurrency:
  group: generate-post
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out which transcripts to process
        id: find
        env:
          BEFORE: ${{ github.event.before }}
          INPUT_SLUG: ${{ github.event.inputs.slug }}
        run: |
          if [ -n "$INPUT_SLUG" ]; then
            SLUGS="$INPUT_SLUG"
          else
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="HEAD~1..HEAD"
            else
              RANGE="$BEFORE..HEAD"
            fi
            SLUGS=$(git diff --name-only --diff-filter=AM $RANGE -- '_transcripts/*.txt' \
                    | xargs -r -n1 basename | sed 's/\.txt$//' | tr '\n' ' ')
          fi
          SLUGS=$(echo $SLUGS)
          if [ -z "$SLUGS" ]; then
            echo "No new or changed transcripts in this push."
          else
            for s in $SLUGS; do
              [ -f "_transcripts/$s.txt" ] || { echo "Missing _transcripts/$s.txt"; exit 1; }
            done
            echo "Transcripts to process: $SLUGS"
          fi
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.find.outputs.slugs != ''
        run: pip install --upgrade anthropic

      - name: Generate posts and sidecars
        if: steps.find.outputs.slugs != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLUGS: ${{ steps.find.outputs.slugs }}
        run: |
          for s in $SLUGS; do
            TRANSCRIPT_PATH="_transcripts/$s.txt" SLUG="$s" python .github/scripts/generate_post.py
          done

      - name: Rebuild homepage and walk links
        run: python .github/scripts/build_site.py

      - name: Commit and push
        env:
          SLUGS: ${{ steps.find.outputs.slugs }}
        run: |
          git config user.name "on-foot-bot"
          git config user.email "on-foot-bot@users.noreply.github.com"
          git add _posts/ _data/ index.html
          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Build site${SLUGS:+: generate $SLUGS}"
          git pull --rebase origin main
          git push origin HEAD:main
