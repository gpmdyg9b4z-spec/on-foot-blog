<header>

</header>

<div class="page-wrap">

  <aside class="sidebar">
    <details class="filters" id="filters" open>
      <summary>Search &amp; filter walks</summary>

      <div class="sidebar-section">
        <label class="sidebar-label" for="search-input">Search</label>
        <input class="search-input" type="search" id="search-input" placeholder="Place, guide, subject…">
      </div>

{{FILTERS}}
    </details>
  </aside>

  <main class="posts-area">
    <div class="results-bar">
      <div class="results-count" id="results-count">{{COUNT}} walks</div>
      <button class="clear-filters" id="clear-filters" hidden>Clear filters ×</button>
    </div>
    <div class="posts-list" id="posts-list">
{{CARDS}}
    </div>

  </main>

  <span>ON FOOT — WALKING TOUR NOTES</span> · Notes from the street, the square and the river's edge · Est. 2026
</footer>

<script>
  const cards = Array.from(document.querySelectorAll('.post-card'));
  const active = { place: '', theme: '', series: '' };
  const searchInput = document.getElementById('search-input');
  const clearBtn = document.getElementById('clear-filters');
  const total = cards.length;

  function placeMatches(cardPlace, value) {
    return !value || cardPlace === value || cardPlace.startsWith(value + '/');
  }
  function matches(card, except) {
    const q = searchInput.value.toLowerCase().trim();
    const d = card.dataset;
    if (except !== 'place' && !placeMatches(d.place, active.place)) return false;
    if (except !== 'theme' && active.theme && !d.themes.split(' ').includes(active.theme)) return false;
    if (except !== 'series' && active.series && !d.series.split(' ').includes(active.series)) return false;
    if (q && !(d.search + ' ' + card.textContent.toLowerCase()).includes(q)) return false;
    return true;
  }
  function update() {
    let visible = 0;
    cards.forEach(c => { const ok = matches(c); c.hidden = !ok; if (ok) visible++; });
    // live counts: how many walks each button would show, given the other filters
    document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
      const f = btn.dataset.filter, v = btn.dataset.value;
      const n = cards.filter(c => matches(c, f) && (f === 'place' ? placeMatches(c.dataset.place, v)
                 : !v || c.dataset[f === 'theme' ? 'themes' : 'series'].split(' ').includes(v))).length;
      btn.querySelector('.n').textContent = n;
      btn.classList.toggle('empty', n === 0 && !btn.classList.contains('active'));
    });
    document.getElementById('results-count').textContent =
      visible === total ? `${total} walks` : `${visible} of ${total} walks`;
    document.getElementById('no-results').hidden = visible > 0;
    clearBtn.hidden = !(active.place || active.theme || active.series || searchInput.value.trim());
  }
  function select(filter, value) {
    active[filter] = value;
    document.querySelectorAll(`.filter-btn[data-filter="${filter}"]`).forEach(b =>
      b.classList.toggle('active', b.dataset.value === value));
    update();
  }
  document.querySelectorAll('.filter-btn[data-filter]').forEach(btn =>
    btn.addEventListener('click', () => select(btn.dataset.filter, btn.dataset.value)));
  searchInput.addEventListener('input', update);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    ['place', 'theme', 'series'].forEach(f => select(f, ''));
  });
  // filters start collapsed on phones
  if (window.matchMedia('(max-width: 720px)').matches) document.getElementById('filters').open = false;
  update();
</script>
